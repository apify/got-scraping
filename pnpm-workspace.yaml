minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@apify/*"
  - "@crawlee/*"
  - "apify-client"
  - "apify"
  - "crawlee"
  - "got-scraping"
  - "body-parser@1.20.9"

nodeLinker: hoisted
linkWorkspacePackages: true
preferWorkspacePackages: true
publicHoistPattern:
    - "*"

overrides:
  "@typescript-eslint/typescript-estree>minimatch": ^9.0.7
  gray-matter>toml: ^5.0.1
